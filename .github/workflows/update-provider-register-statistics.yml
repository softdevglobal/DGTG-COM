name: Update NDIS Provider Register statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - main
    paths:
      - "scripts/update_provider_register_stats.py"
      - ".github/workflows/update-provider-register-statistics.yml"

permissions:
  contents: write

concurrency:
  group: provider-register-statistics
  cancel-in-progress: false

jobs:
  update:
    name: Fetch and publish aggregate statistics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stream official Provider Register CSV with retries
        shell: bash
        run: |
          set -euo pipefail
          csv_url="https://www.ndiscommission.gov.au/provider-registration/find-registered-provider/download-csv"
          csv_path="/tmp/ndis-provider-register.csv"
          header_path="/tmp/ndis-provider-register.headers"

          curl \
            --fail \
            --location \
            --compressed \
            --connect-timeout 30 \
            --max-time 600 \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            --user-agent "Mozilla/5.0 (compatible; DGTG-Provider-Register-Research/1.0; +https://github.com/softdevglobal/DGTG-COM)" \
            --header "Accept: text/csv,text/plain;q=0.9,*/*;q=0.1" \
            --dump-header "$header_path" \
            --output "$csv_path" \
            "$csv_url"

          test -s "$csv_path"
          bytes=$(wc -c < "$csv_path")
          echo "Downloaded $bytes bytes"
          if [ "$bytes" -lt 200 ]; then
            echo "Downloaded file is unexpectedly small"
            cat "$csv_path"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/ndis-provider-register.csv")
          sample = path.read_bytes()[:2048].lstrip().lower()
          if sample.startswith(b"<!doctype") or sample.startswith(b"<html"):
              raise SystemExit("The download returned HTML instead of CSV")
          if b"," not in sample:
              raise SystemExit("The download does not appear to contain a comma-separated header")
          print("CSV download passed basic content checks")
          PY

      - name: Generate aggregate report from downloaded CSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import sys
          from pathlib import Path

          script_path = Path("scripts/update_provider_register_stats.py")
          spec = importlib.util.spec_from_file_location("provider_stats", script_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load provider statistics generator")

          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          csv_path = Path("/tmp/ndis-provider-register.csv")
          header_path = Path("/tmp/ndis-provider-register.headers")
          headers: dict[str, str] = {}
          for line in header_path.read_text(encoding="utf-8", errors="replace").splitlines():
              if ":" not in line:
                  continue
              key, value = line.split(":", 1)
              headers[key.strip().casefold()] = value.strip()

          payload = module.DownloadResult(
              content=csv_path.read_bytes(),
              content_type=headers.get("content-type", "text/csv"),
              last_modified=headers.get("last-modified"),
              etag=headers.get("etag"),
          )
          module.download_csv = lambda: payload
          raise SystemExit(module.main())
          PY

      - name: Verify aggregate-only output schema
        shell: bash
        run: |
          set -euo pipefail
          test -f data/provider-register-summary.json
          test -f PROVIDER_REGISTER_STATISTICS.md
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/provider-register-summary.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          forbidden_top_level = {
              "providers",
              "records",
              "rows",
              "provider_names",
              "business_names",
              "legal_names",
              "abns",
              "contacts",
          }
          leaked = forbidden_top_level.intersection(data)
          if leaked:
              raise SystemExit(f"Provider-level collections found: {sorted(leaked)}")

          counts = data.get("counts")
          if not isinstance(counts, dict):
              raise SystemExit("Missing aggregate counts object")

          for dimension, items in counts.items():
              if not isinstance(items, list):
                  raise SystemExit(f"{dimension} is not an aggregate list")
              for item in items:
                  if not isinstance(item, dict) or set(item) != {"label", "count"}:
                      raise SystemExit(f"Invalid aggregate item in {dimension}: {item!r}")
                  if not isinstance(item["label"], str) or not isinstance(item["count"], int):
                      raise SystemExit(f"Invalid aggregate types in {dimension}: {item!r}")

          print("Aggregate-only output schema verified")
          PY

      - name: Commit changed aggregate outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/provider-register-summary.json PROVIDER_REGISTER_STATISTICS.md
          if git diff --cached --quiet; then
            echo "No provider-register changes to publish."
            exit 0
          fi
          git commit -m "Update aggregate NDIS Provider Register statistics"
          git push
