name: Update NDIS Provider Register statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - main
    paths:
      - "scripts/update_provider_register_stats.py"
      - ".github/workflows/update-provider-register-statistics.yml"

permissions:
  contents: write

concurrency:
  group: provider-register-statistics
  cancel-in-progress: false

jobs:
  update:
    name: Fetch and publish aggregate statistics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate aggregate report
        run: python scripts/update_provider_register_stats.py

      - name: Verify aggregate-only output schema
        shell: bash
        run: |
          set -euo pipefail
          test -f data/provider-register-summary.json
          test -f PROVIDER_REGISTER_STATISTICS.md
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/provider-register-summary.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          forbidden_top_level = {
              "providers",
              "records",
              "rows",
              "provider_names",
              "business_names",
              "legal_names",
              "abns",
              "contacts",
          }
          leaked = forbidden_top_level.intersection(data)
          if leaked:
              raise SystemExit(f"Provider-level collections found: {sorted(leaked)}")

          counts = data.get("counts")
          if not isinstance(counts, dict):
              raise SystemExit("Missing aggregate counts object")

          for dimension, items in counts.items():
              if not isinstance(items, list):
                  raise SystemExit(f"{dimension} is not an aggregate list")
              for item in items:
                  if not isinstance(item, dict) or set(item) != {"label", "count"}:
                      raise SystemExit(f"Invalid aggregate item in {dimension}: {item!r}")
                  if not isinstance(item["label"], str) or not isinstance(item["count"], int):
                      raise SystemExit(f"Invalid aggregate types in {dimension}: {item!r}")

          print("Aggregate-only output schema verified")
          PY

      - name: Commit changed aggregate outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/provider-register-summary.json PROVIDER_REGISTER_STATISTICS.md
          if git diff --cached --quiet; then
            echo "No provider-register changes to publish."
            exit 0
          fi
          git commit -m "Update aggregate NDIS Provider Register statistics"
          git push
